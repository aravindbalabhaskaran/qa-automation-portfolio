[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers --strict-config
markers =
    smoke: fast checks that prove the main flows work (run on every commit)
    regression: broader coverage, run nightly or before release
    ui: browser tests driven by Playwright
    api: HTTP-level tests (no browser)
    e2e: flows that cross UI and API
